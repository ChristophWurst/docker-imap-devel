# Shared mailbox visible to every account as "Shared.Team".
# No acl plugin: without it Dovecot grants full rights on public namespaces,
# and every account maps to the same uid/gid (see 10-auth.conf userdb).
# The separator must match the private maildir namespace, hence "." and not "/".
namespace {
  type = public
  separator = .
  prefix = Shared.
  location = maildir:/var/mail/public
  subscriptions = no
  list = children
}

# Note: \Seen and other flags are shared by all users. Add
# :INDEXPVT=~/public-index to the location above if a test needs per-user flags.
